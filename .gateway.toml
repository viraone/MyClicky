# Drop this file in the root of each project you want Claude to delegate work on.

[studio]
# Mac Studio (oMLX, DeepSeek V4-Flash) since 2026-11-06. The key is read from a private file, never stored here.
# To go back to Qwen on the MacBook, use these three lines instead:
#   base_url = "http://localhost:8080/v1"
#   model    = "mlx-community/Qwen3-Coder-Next-6bit"
#   api_key  = "local"
base_url     = "http://Mac-Studio.local:8000/v1"
model        = "DeepSeek-V4-Flash-0731-MXFP4-MLX"
api_key_file = "~/.config/omlx-studio/api_key"
temperature = 0.2
max_tokens = 16000
timeout_s  = 600

[gate]
# Run in order; first non-zero exit = fail. About 12 seconds with a warm build cache (2026-10-31).
commands = ["swift build --build-system native --disable-sandbox", "swift test --build-system native --disable-sandbox"]

[limits]
max_retries    = 2        # Qwen retries before Claude hears about a failure
max_file_bytes = 200000   # skip files bigger than this when sending context to Qwen
tail_lines     = 60       # how many lines of test output Claude sees
