name: ClickyRemote
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
targets:
  ClickyRemote:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Clicky Remote uses the camera to snap a photo and send it to WhatsApp on your Mac.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Clicky Remote uses the microphone so you can speak questions to your Mac.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your speech is transcribed on-device before being sent to your Mac.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Clicky Remote connects to the MyClicky app running on your Mac over your local network.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 5.9
    info:
      path: Info.plist
      properties:
        NSBonjourServices: [_clicky._tcp]
        NSCameraUsageDescription: Clicky Remote uses the camera to snap a photo and send it to WhatsApp on your Mac.
        NSMicrophoneUsageDescription: Clicky Remote uses the microphone so you can speak questions to your Mac.
        NSSpeechRecognitionUsageDescription: Your speech is transcribed on-device before being sent to your Mac.
        NSLocalNetworkUsageDescription: Clicky Remote connects to the MyClicky app running on your Mac over your local network.
        UILaunchScreen: {}
